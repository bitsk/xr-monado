[package]
name = "xros-passthrough"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "XROS runtime camera projection for OpenXR alpha environment blending"
[lib]
crate-type = ["staticlib"]
[dependencies]
anyhow = "1"
ash = { version = "0.38", default-features = false, features = ["debug", "std"] }
openxr = "=0.22.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
lto = "thin"
